{% extends 'base.html' %}{% block title %}New source{% endblock %}{% block content %}
<p class="eyebrow">Connect a courier</p><h1>Create a source</h1><p class="subtitle">HookDesk will generate a unique endpoint and a signing secret.</p>
<div class="panel"><form action="/sources" method="post" hx-post="/sources" hx-target="#source-result" hx-disabled-elt="find button"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label class="form-label" for="name">Source display name</label><input class="form-control mb-3" id="name" name="name" required maxlength="120" placeholder="e.g. Courier sandbox"><button class="btn btn-primary" type="submit">Create source</button><span class="htmx-indicator help ms-3" role="status">Creating…</span></form></div><div id="source-result" aria-live="polite"></div>{% endblock %}
