<div class="pagination-row"><span>{{ result.total }} total · Page {{ result.page }} of {{ [1, ((result.total + result.page_size - 1) // result.page_size)] | max }}</span><div>
{% if result.page > 1 %}<a class="btn btn-sm btn-outline-secondary" href="{{ request.url.include_query_params(page=result.page-1) }}">Previous</a>{% endif %}
{% if result.page * result.page_size < result.total %}<a class="btn btn-sm btn-outline-secondary" href="{{ request.url.include_query_params(page=result.page+1) }}">Next</a>{% endif %}</div></div>
